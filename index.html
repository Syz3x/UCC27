<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UCC 27 | Ultimate Club Championship</title>
    <style>
        /* Genel Ayarlar ve Renk Paleti */
        :root {
            --bg-main: #0a0a0a;
            --bg-card: #141414;
            --accent-red: #8b0000;
            --text-light: #e0e0e0;
            --text-white: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-light);
            line-height: 1.6;
        }

        /* Sticky Header (Üst Menü) */
        header {
            position: sticky;
            top: 0;
            background-color: rgba(10, 10, 10, 0.95);
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--accent-red);
            z-index: 1000;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: var(--text-white);
            letter-spacing: 2px;
        }

        .logo span {
            color: var(--accent-red);
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 30px;
        }

        nav ul li a {
            color: var(--text-light);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
        }

        nav ul li a:hover {
            color: var(--accent-red);
        }

        /* Hero Section (Karşılama Alanı) */
        .hero {
            height: 60vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: linear-gradient(180deg, #1a1a1a 0%, var(--bg-main) 100%);
            border-bottom: 1px solid #222;
        }

        .hero h1 {
            font-size: 4rem;
            color: var(--text-white);
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 4px;
        }

        .hero p {
            font-size: 1.2rem;
            color: #888;
            max-width: 600px;
        }

        /* Teams Section (Takımlar Vitrini) */
        .teams-section {
            padding: 60px 50px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .section-title {
            font-size: 2rem;
            color: var(--text-white);
            margin-bottom: 40px;
            text-align: center;
            text-transform: uppercase;
            border-bottom: 2px solid var(--accent-red);
            display: inline-block;
            padding-bottom: 10px;
        }

        .teams-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 30px;
        }

        /* Takım Kartları Tasarımı */
        .team-card {
            background-color: var(--bg-card);
            border: 1px solid #333;
            border-radius: 8px;
            padding: 30px 20px;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .team-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-red);
            box-shadow: 0 5px 15px rgba(139, 0, 0, 0.4);
        }

        .team-logo {
            width: 100px;
            height: 100px;
            object-fit: contain;
            margin-bottom: 20px;
        }

        .team-name {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--text-white);
        }

        /* Yükleniyor Yazısı */
        .loading {
            text-align: center;
            font-size: 1.2rem;
            color: var(--accent-red);
            grid-column: 1 / -1;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">UCC <span>27</span></div>
        <nav>
            <ul>
                <li><a href="#">Ana Sayfa</a></li>
                <li><a href="#teams">Takımlar</a></li>
            </ul>
        </nav>
    </header>

    <section class="hero">
        <h1>Ultimate Club Championship</h1>
        <p>Avrupa'nın en büyük simülasyon turnuvasına hoş geldiniz. Büyük mücadele başlıyor.</p>
    </section>

    <section class="teams-section" id="teams">
        <div style="text-align: center;">
            <h2 class="section-title">Katılımcı Takımlar</h2>
        </div>
        
        <div class="teams-grid" id="teams-container">
            <div class="loading">Veritabanına bağlanılıyor... (Google Sheets)</div>
        </div>
    </section>

    <script>
        // Yeni gönderdiğin link API_URL'e eklendi
        const API_URL = "https://script.google.com/macros/s/AKfycbwk8bPSHYIiSP4TtnDgF6UqgKhGhMNzYFZTZyvjN6HmTgZXYiyHgaFYuoVDJqX-8ir3/exec";

        async function fetchTeams() {
            const container = document.getElementById('teams-container');
            
            try {
                const response = await fetch(API_URL);
                const teams = await response.json();
                
                container.innerHTML = ''; // Yükleniyor yazısını temizle
                
                teams.forEach(team => {
                    // Sadece adı olan boş satırları atlamak için basit bir kontrol
                    if(team.TakimAdi) {
                        const card = document.createElement('div');
                        card.className = 'team-card';
                        
                        card.innerHTML = `
                            <img src="${team.LogoURL}" alt="${team.TakimAdi} Logosu" class="team-logo">
                            <div class="team-name">${team.TakimAdi}</div>
                        `;
                        
                        container.appendChild(card);
                    }
                });

            } catch (error) {
                container.innerHTML = '<div class="loading">Takımlar yüklenirken bir hata oluştu. API linkini kontrol et!</div>';
                console.error("Veri çekme hatası:", error);
            }
        }

        // Sayfa yüklendiğinde takımları çek
        window.onload = fetchTeams;
    </script>

</body>
</html>
