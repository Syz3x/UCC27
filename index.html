<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UCC 27 - Turnuva Platformu</title>
    <style>
        :root {
            --theme-dark: #050505;
            --theme-black: #121212;
            --theme-dark-red: #240000;
            --theme-red: #b30000;
            --accent-color: #ff1a1a;
            --text-main: #ffffff;
            --text-muted: #999999;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, var(--theme-dark), var(--theme-dark-red));
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ÜST MENÜ */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 40px;
            background-color: var(--theme-red); 
            border-bottom: 2px solid #800000; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .logo { cursor: pointer; display: flex; align-items: center; }
        .logo img { height: 140px; filter: brightness(0) invert(1); object-fit: contain; }

        nav { display: flex; gap: 35px; }
        nav a { color: var(--text-main); text-decoration: none; font-size: 18px; font-weight: 700; text-transform: uppercase; transition: all 0.3s; cursor: pointer; padding-bottom: 5px; border-bottom: 3px solid transparent; }
        nav a:hover, nav a.active { color: #ffffff; border-bottom: 3px solid #ffffff; }

        .header-right { display: flex; align-items: center; gap: 25px; }
        .lang-select { background-color: rgba(0, 0, 0, 0.2); color: white; border: 1px solid rgba(255, 255, 255, 0.4); padding: 8px 12px; border-radius: 5px; font-weight: 600; font-size: 14px; cursor: pointer; outline: none; transition: 0.3s; }
        .lang-select:hover { background-color: rgba(0, 0, 0, 0.4); border-color: white; }
        .lang-select option { color: #000; font-weight: bold; }
        .user-login { font-size: 15px; display: flex; align-items: center; gap: 10px; cursor: pointer; font-weight: 600; }

        .page-content { flex: 1; }
        .page-view { display: none; }
        .page-view.active-page { display: block; }

        /* SKORBORD & ANA SAYFA */
        .scoreboard-section { display: flex; align-items: center; padding: 20px 40px; gap: 15px; border-bottom: 1px solid rgba(204, 0, 0, 0.2); }
        .matches-container { display: flex; gap: 15px; overflow-x: auto; scrollbar-width: none; }
        .match-card { background-color: var(--theme-black); border: 1px solid rgba(255, 255, 255, 0.05); padding: 10px 15px; border-radius: 8px; min-width: 180px; font-size: 13px; display: flex; flex-direction: column; gap: 5px; cursor: pointer; transition: all 0.3s; }
        .match-card:hover { transform: translateY(-3px); background-color: var(--theme-red); border-color: var(--text-main); }
        .team-row { display: flex; justify-content: space-between; font-weight: 500; }
        .view-all-btn { background: transparent; color: var(--accent-color); border: 1px solid var(--accent-color); padding: 10px 15px; border-radius: 20px; cursor: pointer; white-space: nowrap; transition: 0.3s; font-weight: bold; }
        .view-all-btn:hover { background: var(--accent-color); color: var(--theme-dark); }

        .main-content { display: grid; grid-template-columns: 2fr 1fr; gap: 30px; padding: 40px; max-width: 1400px; margin: 0 auto; }
        .hero-section { position: relative; border-radius: 12px; overflow: hidden; min-height: 400px; background-color: var(--theme-black); border: 1px solid rgba(204, 0, 0, 0.3); cursor: pointer; transition: transform 0.3s, box-shadow 0.3s; }
        .hero-section:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(204, 0, 0, 0.4); }
        .hero-section img { width: 100%; height: 100%; object-fit: cover; position: absolute; opacity: 0.8; transition: opacity 0.3s; }
        .hero-section:hover img { opacity: 1; }
        .hero-text { position: absolute; bottom: 20px; left: 20px; background-color: rgba(204, 0, 0, 0.9); color: white; padding: 15px 25px; border-radius: 8px; font-size: 22px; font-weight: bold; }

        .headlines-section { background-color: rgba(18, 18, 18, 0.8); border-radius: 12px; padding: 20px; border: 1px solid rgba(255, 255, 255, 0.05); }
        .headlines-title { font-size: 20px; margin-bottom: 20px; border-bottom: 1px solid rgba(204, 0, 0, 0.5); padding-bottom: 10px; color: var(--accent-color); }
        .headline-item { display: flex; gap: 15px; margin-bottom: 15px; cursor: pointer; transition: all 0.3s; padding: 10px; border-radius: 8px; }
        .headline-item:hover { background-color: rgba(204, 0, 0, 0.15); transform: translateX(5px); }
        .headline-img { width: 100px; height: 70px; background-color: #333; border-radius: 8px; object-fit: cover; }
        .headline-text { font-size: 15px; font-weight: 600; flex: 1; color: var(--text-main); display: flex; align-items: center; }

        .content-page-container { max-width: 1400px; margin: 40px auto; padding: 0 40px; }
        .page-title { font-size: 28px; color: var(--text-main); margin-bottom: 30px; border-bottom: 2px solid var(--theme-red); padding-bottom: 10px; text-transform: uppercase; text-align: left; }
        
        /* GRUPLAR */
        .groups-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 25px; margin-bottom: 40px; }
        .group-card { background-color: var(--theme-black); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 10px; overflow: hidden; }
        .group-header { background-color: var(--theme-red); color: white; padding: 12px; font-weight: bold; font-size: 18px; text-align: center; border-bottom: 2px solid #800000; }
        .group-stats-header { display: flex; align-items: center; padding: 8px 15px 8px 25px; background-color: rgba(0,0,0,0.5); font-size: 11px; color: var(--text-muted); font-weight: bold; border-bottom: 1px solid rgba(255,255,255,0.1); text-transform: uppercase; }
        .group-row { display: flex; align-items: center; padding: 8px 15px 8px 25px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); position: relative; background-color: rgba(0,0,0,0.2); }
        .group-row:hover { background-color: rgba(255,255,255,0.05); }
        .status-bar { position: absolute; left: 0; top: 0; bottom: 0; width: 5px; }
        .status-blue { background-color: #007bff; }
        .status-orange { background-color: #fd7e14; }
        .team-col { flex: 1; display: flex; align-items: center; overflow: hidden; text-overflow: ellipsis; }
        .stat-col { width: 28px; text-align: center; font-size: 13px; font-weight: bold; color: var(--text-main); }
        .stat-col:last-child { width: 32px; color: var(--accent-color); }
        .team-logo-small { width: 25px; height: 25px; margin-right: 12px; object-fit: contain; }
        .group-team-name { font-size: 14px; font-weight: 600; }

        /* MAÇLAR (FIXTURES) STİLLERİ YENİ */
        .fixtures-header-controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; background: var(--theme-black); padding: 15px 25px; border-radius: 10px; border: 1px solid rgba(204, 0, 0, 0.3); }
        .group-select-dropdown { padding: 10px 20px; font-size: 16px; font-weight: bold; background: var(--theme-red); color: white; border: none; border-radius: 8px; cursor: pointer; outline: none; }
        .group-select-dropdown option { background: var(--theme-black); color: white; }
        
        .matchday-container { margin-bottom: 40px; }
        .matchday-title { font-size: 20px; color: var(--accent-color); margin-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 8px; font-weight: bold; }
        
        .fixture-row { display: flex; background: rgba(18, 18, 18, 0.8); border: 1px solid rgba(255,255,255,0.05); margin-bottom: 10px; border-radius: 8px; padding: 12px 20px; align-items: center; transition: background 0.3s; }
        .fixture-row:hover { background: rgba(204, 0, 0, 0.15); }
        
        .fixture-time-info { width: 150px; display: flex; flex-direction: column; font-size: 13px; color: var(--text-muted); border-right: 1px solid rgba(255,255,255,0.1); padding-right: 15px; }
        .fixture-date { font-weight: bold; color: #ddd; }
        
        .fixture-teams-wrapper { flex: 1; display: flex; align-items: center; justify-content: center; padding: 0 20px; }
        .fixture-team { flex: 1; display: flex; align-items: center; font-size: 16px; font-weight: 600; }
        .fixture-team.home { justify-content: flex-end; text-align: right; }
        .fixture-team.away { justify-content: flex-start; text-align: left; }
        
        .fixture-logo { width: 35px; height: 35px; object-fit: contain; margin: 0 15px; }
        
        .fixture-score-box { background: var(--theme-black); border: 1px solid rgba(204,0,0,0.5); border-radius: 6px; padding: 6px 15px; font-size: 18px; font-weight: bold; color: var(--text-main); min-width: 70px; text-align: center; margin: 0 15px; letter-spacing: 2px; }
        .fixture-score-box.unplayed { color: var(--text-muted); font-size: 14px; letter-spacing: normal; background: transparent; border-color: rgba(255,255,255,0.1); }

        /* TAKIMLAR */
        .teams-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 20px; }
        .team-card { background-color: var(--theme-black); border: 1px solid rgba(204, 0, 0, 0.2); border-radius: 10px; padding: 20px 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; cursor: pointer; transition: all 0.3s ease; text-align: center; }
        .team-card:hover { background-color: var(--theme-red); transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5); }
        .team-logo-container { width: 70px; height: 70px; display: flex; align-items: center; justify-content: center; }
        .team-logo-container img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .team-name { font-size: 14px; font-weight: 600; }

        /* MAKALELER */
        .article-container { max-width: 1000px; margin: 40px auto; background-color: var(--theme-black); border-radius: 12px; border: 1px solid rgba(204, 0, 0, 0.2); padding: 40px; }
        .article-title { font-size: 36px; font-weight: bold; margin-bottom: 10px; }
        .article-subtitle { font-size: 14px; color: var(--text-muted); margin-bottom: 30px; font-weight: 500; }
        .article-image { width: 100%; border-radius: 12px; margin-bottom: 30px; border: 1px solid rgba(255,255,255,0.1); }
        .article-content p { font-size: 17px; line-height: 1.6; margin-bottom: 20px; color: #ddd; text-align: center; }

        footer { background-color: var(--theme-black); padding: 30px 40px; margin-top: auto; text-align: center; border-top: 4px solid var(--theme-red); }
        .sponsors-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 30px; }
        .sponsors-grid img { height: 50px; max-width: 120px; object-fit: contain; }
    </style>
</head>
<body>

    <header>
        <a class="logo" onclick="switchPage('home')">
            <img src="image1.webp" alt="UCC 27 Logo" onerror="this.onerror=null; this.src='image1.png';">
        </a>
        <nav>
            <a id="nav-home" class="active" onclick="switchPage('home')" data-i18n="home">Home</a>
            <a id="nav-groups" onclick="switchPage('groups')" data-i18n="groupsNav">Groups</a>
            <a id="nav-matches" onclick="switchPage('matches')" data-i18n="matches">Matches</a>
            <a id="nav-draws" onclick="switchPage('draws')" data-i18n="draws">Draws</a>
            <a id="nav-teams" onclick="switchPage('teams')" data-i18n="teams">Teams</a>
            <a id="nav-news" onclick="switchPage('news')" data-i18n="news">News</a>
        </nav>
        <div class="header-right">
            <select id="lang-selector" class="lang-select" onchange="changeLanguage(this.value)">
                <option value="en">English (EN)</option>
                <option value="tr">Türkçe (TR)</option>
            </select>
            <div class="user-login"><span data-i18n="login">Log in</span> 👤</div>
        </div>
    </header>

    <div class="page-content">
        <!-- 1. ANA SAYFA -->
        <div id="view-home" class="page-view active-page">
            <main class="main-content">
                <div class="hero-section" onclick="switchPage('news')">
                    <img src="image2.webp" alt="Draw News Image" onerror="this.onerror=null; this.src='image2.png';">
                    <div class="hero-text" data-i18n="newsDraw">UCC 27 Play-off draw in Madrid</div>
                </div>
            </main>
        </div>

        <!-- 2. GRUPLAR -->
        <div id="view-groups" class="page-view">
            <div class="content-page-container">
                <h1 class="page-title" data-i18n="groupsTitle">Groups</h1>
                <div id="groups-grid" class="groups-grid"><p id="groups-loading-text" data-i18n="loading">Veriler çekiliyor...</p></div>
            </div>
        </div>

        <!-- 3. MAÇLAR (YENİ YAPI) -->
        <div id="view-matches" class="page-view">
            <div class="content-page-container">
                <h1 class="page-title" data-i18n="matches">Matches</h1>
                
                <div class="fixtures-header-controls">
                    <span style="font-size: 18px; font-weight: bold;" data-i18n="filterGroup">Filter by Group:</span>
                    <select id="fixture-group-select" class="group-select-dropdown" onchange="renderFixtures(this.value)">
                        <!-- JS ile Grup 1'den 32'ye kadar dolacak -->
                    </select>
                </div>

                <div id="fixtures-container">
                    <p id="fixtures-loading-text" style="color: var(--accent-color); text-align: center; padding: 50px;" data-i18n="loading">Fikstür yükleniyor...</p>
                </div>
            </div>
        </div>

        <!-- 5. TAKIMLAR -->
        <div id="view-teams" class="page-view">
            <div class="content-page-container">
                <h1 class="page-title" data-i18n="partTeams">Participating Teams</h1>
                <div id="teams-grid" class="teams-grid"></div>
            </div>
        </div>

        <!-- DRAWS & NEWS -->
        <div id="view-draws" class="page-view">
            <div class="article-container">
                <h1 class="article-title" data-i18n="drawTitle">UCC 27 Play-off draw</h1>
            </div>
        </div>
        <div id="view-news" class="page-view">
            <div class="article-container">
                <h1 class="article-title" data-i18n="newsDraw">UCC 27 Play-off draw in Madrid</h1>
            </div>
        </div>
    </div>

    <footer>
        <div class="sponsors-grid">
            <img src="image_370b3c.png" alt="Sponsor 1" onerror="this.onerror=null; this.src='image3.webp';">
        </div>
    </footer>

    <script>
        // Yeni API Linki Buraya Eklendi!
        const scriptURL = 'https://script.google.com/macros/s/AKfycbxELrTmQYM5hUQJoLGJxmUuncrcIySepKVLX3vtmU3gVnpX7ujSfeMoEKZd2QA7snS0/exec';
        
        let dataLoaded = false;
        let matchesLoaded = false;
        
        let teamLogos = {}; // Takım logolarını hafızada tutacağımız yer (Otomatik eşleşme için)
        let allMatches = []; // Tüm fikstürü tutacağımız dizi

        const translations = {
            en: { home: "Home", groupsNav: "Groups", groupsTitle: "Groups", matches: "Matches", draws: "Draws", teams: "Teams", news: "News", login: "Log in", partTeams: "Participating Teams", loading: "Loading data...", filterGroup: "Select Group:", tbd: "TBD", groupWord: "Group", newsDraw: "UCC 27 Play-off draw in Madrid", drawTitle: "UCC 27 Play-off draw", th_team: "Team", th_om: "Pld", th_g: "W", th_b: "D", th_m: "L", th_ag: "GF", th_yg: "GA", th_a: "GD", th_p: "Pts", vs: "v" },
            tr: { home: "Ana Sayfa", groupsNav: "Gruplar", groupsTitle: "Gruplar", matches: "Maçlar", draws: "Kuralar", teams: "Takımlar", news: "Haberler", login: "Giriş yap", partTeams: "Katılan Takımlar", loading: "Veriler çekiliyor...", filterGroup: "Grup Seçin:", tbd: "Bilinmiyor", groupWord: "Grup", newsDraw: "UCC 27 Play-off kura çekimi Madrid'de", drawTitle: "UCC 27 Play-off Kura Çekimi", th_team: "Takım", th_om: "OM", th_g: "G", th_b: "B", th_m: "M", th_ag: "AG", th_yg: "YG", th_a: "A", th_p: "P", vs: "v" }
        };

        function changeLanguage(lang) {
            document.querySelectorAll('[data-i18n]').forEach(element => {
                const key = element.getAttribute('data-i18n');
                if (translations[lang] && translations[lang][key]) {
                    element.innerHTML = translations[lang][key]; 
                }
            });
            if(matchesLoaded) renderFixtures(document.getElementById('fixture-group-select').value);
        }

        function switchPage(page) {
            document.querySelectorAll('.page-view').forEach(el => el.classList.remove('active-page'));
            document.querySelectorAll('nav a').forEach(el => el.classList.remove('active'));
            if (document.getElementById('view-' + page)) document.getElementById('view-' + page).classList.add('active-page');
            if (document.getElementById('nav-' + page)) document.getElementById('nav-' + page).classList.add('active');

            if ((page === 'teams' || page === 'groups' || page === 'matches') && !dataLoaded) {
                fetchTournamentData();
            }
        }

        // 1. TAKIMLARI VE GRUPLARI ÇEKME
        async function fetchTournamentData() {
            if (dataLoaded) return;
            const teamsGrid = document.getElementById('teams-grid');
            const groupsGrid = document.getElementById('groups-grid');

            try {
                // Ana tabloyu (Takımlar) çekiyoruz
                const response = await fetch(scriptURL);
                const data = await response.json(); 
                
                teamsGrid.innerHTML = '';
                const groupsData = {};
                for(let i = 1; i <= 32; i++) groupsData[i] = [];

                data.forEach(row => {
                    const values = Object.values(row);
                    const teamName = values[0]; 
                    const logoUrl = values[1];  
                    const groupNum = parseInt(values[2]);

                    if (!teamName || teamName === "Team Name" || teamName.includes("Takim")) return;

                    // LOGOYU SİSTEME KAYDET (Fikstürde otomatik çekmek için)
                    teamLogos[teamName.trim()] = logoUrl;

                    teamsGrid.innerHTML += `
                        <div class="team-card">
                            <div class="team-logo-container"><img src="${logoUrl}"></div>
                            <div class="team-name">${teamName}</div>
                        </div>`;

                    if (groupNum >= 1 && groupNum <= 32) {
                        groupsData[groupNum].push({
                            name: teamName, logo: logoUrl,
                            om: values[3]||0, g: values[4]||0, b: values[5]||0, m: values[6]||0,
                            ag: values[7]||0, yg: values[8]||0, a: values[9]||0, puan: values[10]||0
                        });
                    }
                });

                // Grupları sıralayıp ekrana basma
                let groupsHtml = '';
                for(let i = 1; i <= 32; i++) {
                    let teams = groupsData[i];
                    teams.sort((a, b) => {
                        if (Number(b.puan) !== Number(a.puan)) return Number(b.puan) - Number(a.puan);
                        if (Number(b.a) !== Number(a.a)) return Number(b.a) - Number(a.a);
                        return Number(b.ag) - Number(a.ag);
                    });

                    groupsHtml += `<div class="group-card"><div class="group-header">Grup ${i}</div>`;
                    groupsHtml += `<div class="group-stats-header"><div class="team-col">Takım</div><div class="stat-col">OM</div><div class="stat-col">G</div><div class="stat-col">B</div><div class="stat-col">M</div><div class="stat-col">AG</div><div class="stat-col">YG</div><div class="stat-col">A</div><div class="stat-col">P</div></div>`;

                    for(let j = 0; j < 4; j++) {
                        let bar = j === 0 ? 'status-blue' : (j === 1 ? 'status-orange' : '');
                        if(teams[j]) {
                            const t = teams[j];
                            groupsHtml += `<div class="group-row"><div class="status-bar ${bar}"></div><div class="team-col"><img src="${t.logo}" class="team-logo-small"><span class="group-team-name">${t.name}</span></div><div class="stat-col">${t.om}</div><div class="stat-col">${t.g}</div><div class="stat-col">${t.b}</div><div class="stat-col">${t.m}</div><div class="stat-col">${t.ag}</div><div class="stat-col">${t.yg}</div><div class="stat-col">${t.a}</div><div class="stat-col">${t.puan}</div></div>`;
                        }
                    }
                    groupsHtml += `</div>`;
                }
                groupsGrid.innerHTML = groupsHtml;
                dataLoaded = true;

                // Takımlar yüklendikten hemen sonra Fikstürü çekiyoruz!
                fetchFixtures();

            } catch (error) {
                console.error('Hata:', error);
            }
        }

        // 2. FİKSTÜRÜ ÇEKME (Yeni Fikstur Sekmesinden)
        async function fetchFixtures() {
            try {
                // Apps Script'e '?sayfa=Fikstur' parametresini gönderiyoruz
                const response = await fetch(scriptURL + "?sayfa=Fikstur");
                allMatches = await response.json();
                
                // Dropdown menüyü 32 grup için doldur
                const selectEl = document.getElementById('fixture-group-select');
                selectEl.innerHTML = '';
                for(let i = 1; i <= 32; i++) {
                    selectEl.innerHTML += `<option value="Grup ${i}">Grup ${i}</option>`;
                }

                matchesLoaded = true;
                // İlk açılışta Grup 1'i ekrana bas
                renderFixtures("Grup 1");

            } catch (error) {
                console.error('Fikstür çekilirken hata:', error);
                document.getElementById('fixtures-container').innerHTML = "Fikstür yüklenemedi. Lütfen Apps Script kodunu güncellediğinizden emin olun.";
            }
        }

        // 3. SEÇİLEN GRUBUN FİKSTÜRÜNÜ EKRANA BASMA
        function renderFixtures(selectedGroup) {
            if(!matchesLoaded) return;
            
            const container = document.getElementById('fixtures-container');
            const currentLang = document.getElementById('lang-selector').value;
            const vsText = translations[currentLang].vs;
            
            // Sadece seçilen gruba ait maçları filtrele
            const groupMatches = allMatches.filter(m => Object.values(m)[0] === selectedGroup);
            
            if(groupMatches.length === 0) {
                container.innerHTML = `<p style="text-align:center; padding:30px;">Bu grupta henüz maç bulunmuyor.</p>`;
                return;
            }

            // Maçları haftalara göre grupla (1. Hafta, 2. Hafta vs.)
            const matchesByWeek = {};
            groupMatches.forEach(match => {
                const vals = Object.values(match);
                const hafta = vals[1]; // "1. Hafta"
                if(!matchesByWeek[hafta]) matchesByWeek[hafta] = [];
                matchesByWeek[hafta].push({
                    tarih: vals[2],
                    saat: vals[3],
                    ev: vals[4].trim(),
                    dep: vals[5].trim(),
                    evSkor: vals[6],
                    depSkor: vals[7],
                    durum: vals[8]
                });
            });

            let html = '';
            // Her hafta için ayrı bir blok oluştur
            for (const [haftaAdı, haftaninMaclari] of Object.entries(matchesByWeek)) {
                html += `
                <div class="matchday-container">
                    <div class="matchday-title">${haftaAdı}</div>`;
                
                haftaninMaclari.forEach(m => {
                    // Logoları Takımlar listesinden otomatik bul
                    const evLogo = teamLogos[m.ev] || 'https://via.placeholder.com/35?text=?';
                    const depLogo = teamLogos[m.dep] || 'https://via.placeholder.com/35?text=?';
                    
                    // Maç oynandıysa skoru, oynanmadıysa "v" harfini göster
                    let scoreHtml = '';
                    if (m.durum === "Oynanmadı" || m.evSkor === "" || m.evSkor === undefined) {
                        scoreHtml = `<div class="fixture-score-box unplayed">${vsText}</div>`;
                    } else {
                        scoreHtml = `<div class="fixture-score-box">${m.evSkor} - ${m.depSkor}</div>`;
                    }

                    html += `
                    <div class="fixture-row">
                        <div class="fixture-time-info">
                            <span class="fixture-date">${m.tarih}</span>
                            <span>${m.saat}</span>
                        </div>
                        <div class="fixture-teams-wrapper">
                            <div class="fixture-team home">
                                ${m.ev}
                                <img src="${evLogo}" class="fixture-logo">
                            </div>
                            
                            ${scoreHtml}
                            
                            <div class="fixture-team away">
                                <img src="${depLogo}" class="fixture-logo">
                                ${m.dep}
                            </div>
                        </div>
                    </div>`;
                });
                
                html += `</div>`;
            }
            container.innerHTML = html;
        }

        window.onload = function() {
            changeLanguage(document.getElementById('lang-selector').value);
        }
    </script>
</body>
</html>
